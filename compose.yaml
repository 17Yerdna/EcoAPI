services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ecorecicla
      POSTGRES_USER: eco
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eco_local_demo}
    ports: ["5434:5432"]
    volumes: ["eco_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eco -d ecorecicla"]
      interval: 3s
      timeout: 3s
      retries: 30
  api:
    build: .
    ports: ["8080:8080"]
    environment:
      DB_URL: jdbc:postgresql://db:5432/ecorecicla
      DB_USER: eco
      DB_PASSWORD: ${DB_PASSWORD:-eco_local_demo}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET in .env (minimum 64 characters)}
    depends_on:
      db: {condition: service_healthy}
volumes:
  eco_data:
