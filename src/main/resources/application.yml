spring:
  application:
    name: EcoAPI
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/ecorecicla}
    username: ${DB_USER:eco}
    password: ${DB_PASSWORD:eco_local_demo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
jwt:
  secret: ${JWT_SECRET}
management:
  endpoints:
    web:
      exposure:
        include: health
server:
  error:
    include-message: never
    include-stacktrace: never
